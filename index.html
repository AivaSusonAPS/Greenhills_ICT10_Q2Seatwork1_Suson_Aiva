<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Candidate Verification System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
      /* delete      background: linear-gradient(135deg, #e8f0ff, #f5f8ff); */
/* replacement */ 
            background: #d6d6d6;
            background: radial-gradient(circle, rgba(214, 214, 214, 1) 18%, rgba(135, 165, 199, 1) 100%); /*Source: https://cssgradient.io/ */
            display: flex;
            flex-direction: column;
            color: #1e293b;
        }

        header {
            background: #688da1; /*Changed the color from #3c6377 to #688da1 */
            color: white;
            padding: 22px 8%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #9b9c9c; /*Changed the color from #7dd3fc to #9b9c9c */
        }

        .hero {
            text-align: center;
            padding: 55px 20px 25px;
        }

        .hero .icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: clamp(27px, 4vw, 38px);
            color: #123b72;
            margin-bottom: 12px;
        }

        .hero p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 15px auto 45px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(18, 59, 114, 0.10);
            border: 1px solid #e2e8f0;
        }

        .card h2 {
            color: #123b72;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .card .description {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
            color: #334155;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.2s;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .search-btn {
            width: 100%;
            padding: 14px;
            background: #1d4ed8; /*changed color from 1d4ed8 to 5c81bc */
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .search-btn:hover {
            background: #123b72;
            transform: translateY(-1px);
        }

        #result {
            margin-top: 22px;
            padding: 0;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        #result:not(:empty) {
            padding: 18px;
            border-radius: 10px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .security-note {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 22px;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            header {
                padding: 18px 6%;
            }

            .logo {
                font-size: 19px;
            }

            .hero {
                padding-top: 40px;
            }

            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">CVS <span>|</span> Candidate Verification</div>
    </header>

 <!--Delete   <section class="hero">
        <div class="icon">🔎</div>
        <h1>Candidate Verification System</h1>
        <p>Verify candidate information quickly and easily.</p>
    </section> -->

    <main class="container">
        <div class="card">
            <h2>Search Candidate</h2>
            <p class="description">
                Enter the candidate's name below to check their
                verification record.
            </p>

            <form onsubmit="return false;">
                <div class="form-group">
                    <label for="student_first">First Name</label>
                    <input
                        type="text"
                        id="student_first"
                        placeholder="Enter your first name"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="student_last">Last Name</label>
                    <input
                        type="text"
                        id="student_last"
                        placeholder="Enter your last name"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <input
                    type="button"
                    py-click="student_club"
                    class="search-btn"
                    value="Search Candidate  →"
                >
            </form>

            <div id="result" aria-live="polite"></div>

          <!--Delete <p class="security-note">
                🔒 Candidate information verification portal
            </p> --> 
        </div>
    </main>

    <footer>
        &copy; 2026 Candidate Verification System. All rights reserved.
    </footer>

    <py-script src="main.py"></py-script>

</body>
</html>
